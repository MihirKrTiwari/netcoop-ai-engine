name: NetCoop AI Engine CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Run CLI Scenario Batch Summary
        run: |
          python main.py --scenario-dir scenarios --summary

      - name: Verify Synthetic Scenario Generator & Protocol Log
        run: |
          python scripts/generate_scenarios.py --seed 42 --out-dir scenarios/generated
          python main.py --scenario scenarios/link_congestion.json --message-log out/messages.jsonl --trace
          python main.py --scenario-dir scenarios/generated --summary
